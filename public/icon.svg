<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Lavender Radial Gradient -->
    <radialGradient id="wineGrad" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#342845" />
      <stop offset="100%" stop-color="#181324" />
    </radialGradient>
    
    <!-- Antique Gold Shimmer Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E7" />
      <stop offset="35%" stop-color="#F5E0A3" />
      <stop offset="70%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#8E6A26" />
    </linearGradient>

    <!-- Gold Rim Border Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6CA85" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#8E6A26" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#F5E0A3" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Deep Wine Rounded Seal Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#wineGrad)" stroke="url(#rimGrad)" stroke-width="1.8" />

  <!-- Sacred Celestial Wedding Star (✦) Motif -->
  <path d="M 32 10 Q 32 32 10 32 Q 32 32 32 54 Q 32 32 54 32 Q 32 32 32 10 Z" fill="url(#goldGrad)" />
  
  <!-- Subtle center diamond sparkle -->
  <circle cx="32" cy="32" r="2.2" fill="#FFFDF5" />
</svg>